<main class="container">
    <h2>Fornecedores</h2>
    <a (click)="novo()" class="btn btn-primary">Novo</a>
    <table class="table">
        <thead>
            <tr>
                <th>ID</th>
                <th>CNPJ</th>
                <th>Razão Social</th>
                <th>Nome Fantasia</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let umFornecedor of listaFornecedores">
                <td>{{umFornecedor.id}}</td>
                <td>{{umFornecedor.cnpj}}</td>
                <td>{{umFornecedor.razaoSocial}}</td>
                <td>{{umFornecedor.nomeFantasia}}</td>
                <td><a (click)="alterar(umFornecedor)"
                    class="btn btn-primary">Alterar</a>
                    &nbsp;
                    <a (click)="abrirConfirmacao(umFornecedor)" 
                        class="btn btn-danger">Excluir</a>

                </td>
            </tr>
        </tbody>

    </table>
</main>

<div class="modal fade" #myModal tabindex="-1" role="dialog">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Excluir fornecedor</h5>
            </div>
            <div class="modal-body">
            Confirma a exclusão do fornecedor?
            </div>
            <div class="modal-footer">
            <button type="button" class="btn btn-secondary" (click)="fecharConfirmacao()">Cancelar</button>
            <button type="button" class="btn btn-primary" (click)="confirmarExclusao()">Sim</button>
            </div>
        </div>
    </div>
</div>
